# ============================================
# Configuracion general de la aplicacion
# ============================================
spring.application.name=empareja2
server.port=8090

# ============================================
# Base de datos H2 con persistencia en archivo
# El archivo se guarda en ./data/empareja2.mv.db
# Para migrar a MySQL/PostgreSQL, solo cambia estas
# propiedades y la dependencia del driver en el pom.xml
# ============================================
spring.datasource.url=jdbc:h2:file:./data/empareja2;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2, util para inspeccionar datos en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# Seguridad JWT
# IMPORTANTE: en produccion, mueve el secreto a una variable
# de entorno (JWT_SECRET) y NO lo dejes en el repositorio.
# ============================================
app.jwt.secret=${JWT_SECRET:cE9J3hX2mQpL7vN0rT6yU4wA1zB8dK5fG9jH2sD7lM3nP6qR0tV4xZ8cE1gI5kO}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================
# Swagger / OpenAPI
# ============================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


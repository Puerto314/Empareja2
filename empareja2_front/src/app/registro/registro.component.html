<main class="registro">
  <header>
    <a routerLink="/login" class="link">← Volver a iniciar sesión</a>
    <h1>Crea tu cuenta</h1>
    <p class="muted">Cuéntanos quién eres y dónde estudias para aparecer en el catálogo. Tu correo, documento y fecha de nacimiento nunca se muestran a otros usuarios.</p>
  </header>
  <section class="panel">
    <app-perfil-form modo="registro" textoBoton="Crear cuenta" [cargando]="cargando()" [error]="error()" (enviar)="registrar($event)" />
  </section>
</main>
